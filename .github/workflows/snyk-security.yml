name: Snyk Security

# Snyk static + dynamic security scanning for Patch Mutual (AltoroJ).
# Required repository secrets:
#   SNYK_TOKEN  - Snyk API token (Open Source, Code, Container, IaC)
#   SNYK_APIWEB - Snyk API & Web (DAST) API token
on:
  push:
    branches: [ '*' ]
  pull_request:
    branches: [ '*' ]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  # 1. Snyk Open Source - scan Gradle dependencies (SCA)
  snyk-open-source:
    name: Snyk Open Source (SCA)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
      - uses: snyk/actions/setup@master
      - name: Snyk Open Source test
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: snyk test --all-projects --severity-threshold=low --sarif-file-output=snyk-sca.sarif
      - name: Fix SARIF null security-severity
        if: always()
        run: |
          if [ -f snyk-sca.sarif ]; then
            jq 'walk(if type == "object" and has("security-severity") and (."security-severity" == null) then del(."security-severity") else . end)' snyk-sca.sarif > snyk-sca.sarif.tmp && mv snyk-sca.sarif.tmp snyk-sca.sarif
          fi
      - name: Upload Snyk Open Source SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: snyk-sca.sarif
          category: snyk-open-source
      - name: Snyk monitor (snapshot to Snyk UI)
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: snyk monitor --all-projects

  # 2. Snyk Code - static application security testing (SAST)
  snyk-code:
    name: Snyk Code (SAST)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: snyk/actions/setup@master
      - name: Snyk Code test
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: snyk code test --severity-threshold=low --sarif-file-output=snyk-code.sarif
      - name: Fix SARIF null security-severity
        if: always()
        run: |
          if [ -f snyk-code.sarif ]; then
            jq 'walk(if type == "object" and has("security-severity") and (."security-severity" == null) then del(."security-severity") else . end)' snyk-code.sarif > snyk-code.sarif.tmp && mv snyk-code.sarif.tmp snyk-code.sarif
          fi
      - name: Upload Snyk Code SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: snyk-code.sarif
          category: snyk-code

  # 3. Snyk Container - build the image and scan it
  snyk-container:
    name: Snyk Container
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t patch-mutual:${{ github.sha }} .
      - uses: snyk/actions/setup@master
      - name: Snyk Container test
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: snyk container test patch-mutual:${{ github.sha }} --file=Dockerfile --severity-threshold=low --sarif-file-output=snyk-container.sarif
      - name: Fix SARIF null security-severity
        if: always()
        run: |
          if [ -f snyk-container.sarif ]; then
            jq 'walk(if type == "object" and has("security-severity") and (."security-severity" == null) then del(."security-severity") else . end)' snyk-container.sarif > snyk-container.sarif.tmp && mv snyk-container.sarif.tmp snyk-container.sarif
          fi
      - name: Upload Snyk Container SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: snyk-container.sarif
          category: snyk-container

  # 4. Snyk IaC - scan Kubernetes manifests
  snyk-iac:
    name: Snyk IaC
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: snyk/actions/setup@master
      - name: Snyk IaC test
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: snyk iac test k8s-src --severity-threshold=low --sarif-file-output=snyk-iac.sarif
      - name: Fix SARIF null security-severity
        if: always()
        run: |
          if [ -f snyk-iac.sarif ]; then
            jq 'walk(if type == "object" and has("security-severity") and (."security-severity" == null) then del(."security-severity") else . end)' snyk-iac.sarif > snyk-iac.sarif.tmp && mv snyk-iac.sarif.tmp snyk-iac.sarif
          fi
      - name: Upload Snyk IaC SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: snyk-iac.sarif
          category: snyk-iac

  # 5. Snyk API & Web - trigger a DAST scan against the running app
  snyk-dast:
    name: Snyk API & Web (DAST)
    runs-on: ubuntu-latest
    needs: [ snyk-code, snyk-container ]
    steps:
      - name: Trigger Snyk API & Web (DAST) scans
        env:
          SNYK_APIWEB: ${{ secrets.SNYK_APIWEB }}
        run: |
          # Target IDs from Snyk API & Web (plus.probely.app):
          #   4EgdpNSGpGNR = PatchMutual (web)
          #   p3ch73VytfAX = PatchMutual API (OpenAPI)
          for TARGET in 4EgdpNSGpGNR p3ch73VytfAX; do
            echo "Starting Snyk API & Web (DAST) scan for target $TARGET"
            curl -sS -X POST \
              "https://api.probely.com/targets/$TARGET/scan_now/" \
              -H "Authorization: JWT ${SNYK_APIWEB}" \
              -H "Content-Type: application/json"
          done
